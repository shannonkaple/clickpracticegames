  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

    }

    .viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      border: 0;
      position: absolute;
      top: 0;
      left: 0;

      transform-origin: top left;

      /* Compensate for scaling so the full screen stays filled */
      width: 153.8462%;
      height: 153.8462%;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <iframe
      src="https://www.computerskillslab.com/index.html?lesson=5975"
