<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>STEM Click Practice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    .scaled-frame {
      position: absolute;
      inset: 0;
      width: 125%;
      height: 125%;
      border: 0;
      transform: scale(0.8);
      transform-origin: top left;
      background: #ffffff;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      background: #ffffff;
      color: #17233c;
      z-index: 5;
    }

    .fallback-card {
      max-width: 520px;
      padding: 28px;
      border: 3px solid #5b7cfa;
      border-radius: 24px;
      background: #f7f8ff;
    }

    .fallback a {
      display: inline-block;
      margin-top: 14px;
      padding: 14px 20px;
      border-radius: 999px;
      background: #5b7cfa;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="page">
    <iframe
      id="gameFrame"
      class="scaled-frame"
      src="https://www.computerskillslab.com/index.html?lesson=6527"
      title="STEM Click Practice"
      scrolling="no"
      allowfullscreen>
    </iframe>

    <section class="fallback" id="fallback">
      <div class="fallback-card">
        <h1>STEM Click Practice</h1>
        <p>If the game does not appear above, tap the button below.</p>
        <a href="https://www.computerskillslab.com/index.html?lesson=6527">
          Open Click Practice
        </a>
      </div>
    </section>
  </main>
</body>
</html>
